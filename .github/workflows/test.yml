name: test

# The hosted cross-platform matrix is opt-in to conserve Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      # Hermetic CI: match production-private modes (umask 077) and keep basetemp
      # short enough for AF_UNIX sockets on macOS runners (/var/folders/... is long).
      - name: Pytest (hermetic umask + basetemp)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/agent-cockpit-pytest
          pytest -q --basetemp=/tmp/agent-cockpit-pytest
      - run: |
          for file in *.py tests/*.py; do
            python - "$file" <<'PY'
          import ast, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(), filename=str(path))
          PY
          done
      - run: |
          # node --check 要求可识别的扩展名;mktemp 写法兼容 GNU/BSD(macOS 无 --suffix)
          js_file="$(mktemp -t cockpit-inline-XXXXXX).js"
          sed -n '/<script>$/,/^<\/script>$/p' static/index.html | sed '1d;$d' > "$js_file"
          test -s "$js_file"
          node --check "$js_file"
