name: Fast required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Python + web
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Fast backend contract tests
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/agent-cockpit-pytest
          pytest -q --basetemp=/tmp/agent-cockpit-pytest \
            tests/test_auth_session.py \
            tests/test_security.py \
            tests/test_exception_handlers.py \
            tests/test_files_security.py \
            tests/test_chat_ledger.py \
            tests/test_chat_ledger_api.py \
            tests/test_chat_ledger_sse.py \
            tests/test_agent_mail_tools.py \
            tests/test_hub_client.py \
            tests/test_team_ledger.py \
            tests/test_team_inbox_router.py \
            tests/test_workspace_write_gate.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web unit tests
        working-directory: web
        run: npm test -- --run

      - name: Web typecheck and production build
        working-directory: web
        run: npm run build
